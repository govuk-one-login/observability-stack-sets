---
name: Pre Merge Checks

#Prevent default write-all access - this was pointed out by this checkov check CKV2_GHA_1
permissions:
  contents: read
  actions: read
  security-events: write

on:
  push:
    branches-ignore:
      - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Run Checkov
        uses: govuk-one-login/github-actions/code-quality/run-checkov@6d72d3c80a79ab102d120de5038e75dcf9c6a7fc
        with:
          config-file: '.checkov.yaml'
          upload-sarif-file: 'true'
